// Tiresias packaging.
//
//   gradle jar                    build/libs/Tiresias.jar: one jar with FlatLaf inside (runs on Java 21+)
//   gradle bundleAll              build/dist/ self-contained bundles for every platform below
//   gradle bundleMacosAarch64     ...or one at a time: bundleWindowsX64, bundleWindowsAarch64, bundleLinuxX64
//   gradle appImage               native launcher (.exe / .app) for the machine you're on, via jpackage
//   gradle runApp -Pspec=folder   run the browser
//   gradle validateSpec -Pspec=folder [-Pstrict]   headless validation, fails the build on errors
//   gradle icons                  build/icons: the app icon as .png, .icns (macOS) and .ico (Windows)
//   gradle spotlessApply          format everything (Java with Prettier); `gradle format` is the same
//   gradle spotlessCheck          fail if anything isn't formatted; part of `gradle check`, run by CI
//
// Formatting uses Spotless running Prettier and prettier-plugin-java. Spotless downloads the exact
// versions below by itself; it only needs Node.js (npm) installed. The app itself doesn't need Node.
//
// App icon: the app draws its own icon. To use your own instead, put a square PNG (1024x1024 is ideal)
// named icon.png next to this file; it goes into the jar, every bundle and the jpackage app.
//
// Bundles are cross-built: any OS can produce all of them. Each one carries a trimmed Java runtime
// linked from that platform's Temurin JDK (downloaded once, cached in ~/.gradle/caches).
// Gradle itself must run on the same Java release as the bundled runtime (21 by default),
// because jlink can only link modules from its own release. Needs Gradle 8.3 or newer.

plugins {
    id 'java'
    id 'com.diffplug.spotless' version '8.6.0'
}

repositories {
    mavenCentral()
}

dependencies {
    // Modern look for the standard Swing parts (fields, menus, dialogs, file chooser). Merged into the jar below.
    // The app still runs without it (java Tiresias.java) using its built-in look. Bump the version freely.
    implementation 'com.formdev:flatlaf:3.5.4'
}

// Release builds pass the tag's version (-PreleaseVersion=1.2.0); local builds use this default.
version = (findProperty('releaseVersion') ?: '1.0.0').toString()

def jdkFeature = (findProperty('jdkFeature') ?: '21').toString()
def runtimeModules = (findProperty('runtimeModules') ?: 'java.desktop,java.prefs,java.logging').toString()
def hostFeature = JavaVersion.current().majorVersion
def hostOs = System.getProperty('os.name').toLowerCase()
def hostWindows = hostOs.contains('windows')
def hostMac = hostOs.contains('mac')
def javaHome = System.getProperty('java.home')
def jdkTool = { String tool -> new File(javaHome, "bin/${tool}${hostWindows ? '.exe' : ''}").absolutePath }
def appVersion = version.toString()

// Platforms to bundle for. Adding one is a single line: os is mac/windows/linux, arch is x64/aarch64.
def platforms = [
        'macos-aarch64'  : [os: 'mac',     arch: 'aarch64'],
        'windows-x64'    : [os: 'windows', arch: 'x64'],
        'windows-aarch64': [os: 'windows', arch: 'aarch64'],
        'linux-x64'      : [os: 'linux',   arch: 'x64'],
        // 'macos-x64'    : [os: 'mac',   arch: 'x64'],
        // 'linux-aarch64': [os: 'linux', arch: 'aarch64'],
]
def capName = { String key -> key.split('-').collect { it.capitalize() }.join('') }
def hostArch = System.getProperty('os.arch').toLowerCase()
def hostKey = (hostMac ? 'macos' : hostWindows ? 'windows' : 'linux') + '-' + (hostArch in ['aarch64', 'arm64'] ? 'aarch64' : 'x64')

// ---------------------------------------------------------------------------------------------
// Compile the single source file in the project root

// The source can sit next to this file or in src/main/java.
def sourceCandidates = ['Tiresias.java', 'src/main/java/Tiresias.java'].collect { file(it) }
def sourceFile = sourceCandidates.find { it.exists() }

sourceSets {
    main {
        java {
            srcDirs = [sourceFile ? sourceFile.parentFile : file('src/main/java')]
            include 'Tiresias.java'
        }
    }
}

// Without the source, Gradle compiles nothing and builds an empty jar, which then fails at launch with
// "Could not find or load main class Tiresias". Stop the build here instead.
tasks.register('checkSource') {
    def found = sourceFile
    def looked = sourceCandidates.collect { it.absolutePath }
    doLast {
        if (found == null)
            throw new GradleException("Tiresias.java not found. Put it next to build.gradle (exact name, case-sensitive). Looked in:\n  " + looked.join('\n  '))
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

jar {
    dependsOn 'checkSource'
    archiveFileName = 'Tiresias.jar'
    // One self-contained jar: merge the dependencies' classes (and FlatLaf's native helpers) in.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude 'module-info.class', 'META-INF/versions/*/module-info.class', 'META-INF/MANIFEST.MF',
                'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
    manifest {
        attributes(
                'Main-Class': 'Tiresias',
                'Multi-Release': 'true',
                'Implementation-Title': 'Tiresias',
                'Implementation-Version': appVersion)
    }
    from(file('icon.png').exists() ? file('icon.png') : [])   // a custom icon, if there is one, replaces the built-in one
    doLast {
        def jf = archiveFile.get().asFile
        def ok = new java.util.zip.ZipFile(jf).withCloseable { it.getEntry('Tiresias.class') != null }
        if (!ok) throw new GradleException("${jf.name} has no Tiresias.class, so it can't start. Check that compileJava ran (not NO-SOURCE).")
    }
}

tasks.register('runApp', JavaExec) {
    group = 'application'
    description = 'Runs the browser. Open a folder with -Pspec=path'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'Tiresias'
    if (findProperty('spec')) args findProperty('spec').toString()
}

def customIcon = file('icon.png')
def iconDir = layout.buildDirectory.dir('icons')
tasks.register('icons', JavaExec) {
    group = 'distribution'
    description = 'Exports the app icon as .png, .icns and .ico (from icon.png if present, else the built-in design)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'Tiresias'
    jvmArgs '-Djava.awt.headless=true'
    args '--export-icons', iconDir.get().asFile.absolutePath
    if (customIcon.exists()) { args customIcon.absolutePath; inputs.file(customIcon) }
    outputs.dir(iconDir)
}

tasks.register('validateSpec', JavaExec) {
    group = 'verification'
    description = 'Validates spec files without a display: -Pspec=path [-Pstrict to also fail on warnings]'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'Tiresias'
    args '--validate', (findProperty('spec') ?: '.').toString()
    if (project.hasProperty('strict')) args '--strict'
}

// ---------------------------------------------------------------------------------------------
// Launcher scripts shared by the bundles

def launcherDir = layout.buildDirectory.dir('launchers')

def launchers = tasks.register('launchers') {
    description = 'Writes the start scripts and macOS Info.plist used by the bundles'
    def out = launcherDir.get().asFile
    def ver = appVersion
    inputs.property('version', ver)
    outputs.dir(out)
    doLast {
        def write = { String path, String text, boolean crlf ->
            def f = new File(out, path)
            f.parentFile.mkdirs()
            f.setText(crlf ? text.replace('\n', '\r\n') : text, 'UTF-8')
            if (text.startsWith('#!')) f.setExecutable(true, false)   // shell launchers must be executable
        }

        write('unix/Tiresias.sh', '''\
#!/bin/sh
DIR="$(cd "$(dirname "$0")" && pwd)"
CACHE="${XDG_CACHE_HOME:-$HOME/.cache}/Tiresias"
mkdir -p "$CACHE" 2>/dev/null
# The class-data archive is created on first launch and makes later launches start faster.
exec "$DIR/runtime/bin/java" -XX:+AutoCreateSharedArchive -XX:SharedArchiveFile="$CACHE/app.jsa" -Xlog:cds=off -Xlog:cds+dynamic=off \\
  -jar "$DIR/app/Tiresias.jar" "$@"
''', false)
        write('unix/validate.sh', '''\
#!/bin/sh
# Usage: ./validate.sh path/to/spec-folder [--strict] [--info]
DIR="$(cd "$(dirname "$0")" && pwd)"
exec "$DIR/runtime/bin/java" -jar "$DIR/app/Tiresias.jar" --validate "$@"
''', false)

        // Windows batch files need CRLF line endings. javaw has no console window.
        write('windows/Tiresias.bat', '''\
@echo off
if not exist "%LOCALAPPDATA%\\Tiresias" mkdir "%LOCALAPPDATA%\\Tiresias"
start "" "%~dp0runtime\\bin\\javaw.exe" -XX:+AutoCreateSharedArchive -XX:SharedArchiveFile="%LOCALAPPDATA%\\Tiresias\\app.jsa" -Xlog:cds=off -Xlog:cds+dynamic=off -jar "%~dp0app\\Tiresias.jar" %*
''', true)
        write('windows/validate.bat', '''\
@echo off
rem Usage: validate.bat path\\to\\spec-folder [--strict] [--info]
"%~dp0runtime\\bin\\java.exe" -jar "%~dp0app\\Tiresias.jar" --validate %*
exit /b %ERRORLEVEL%
''', true)

        write('mac/Tiresias', '''\
#!/bin/sh
CONTENTS="$(cd "$(dirname "$0")/.." && pwd)"
CACHE="$HOME/Library/Caches/Tiresias"
mkdir -p "$CACHE" 2>/dev/null
exec "$CONTENTS/runtime/bin/java" -Xdock:name="Tiresias" -Xdock:icon="$CONTENTS/Resources/Tiresias.icns" \\
  -XX:+AutoCreateSharedArchive -XX:SharedArchiveFile="$CACHE/app.jsa" -Xlog:cds=off -Xlog:cds+dynamic=off \\
  -Dapple.awt.application.name="Tiresias" \\
  -jar "$CONTENTS/app/Tiresias.jar" "$@"
''', false)
        write('mac/Info.plist', """\
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>CFBundleName</key><string>Tiresias</string>
  <key>CFBundleDisplayName</key><string>Tiresias</string>
  <key>CFBundleIdentifier</key><string>app.tiresias</string>
  <key>CFBundleExecutable</key><string>Tiresias</string>
  <key>CFBundleIconFile</key><string>Tiresias</string>
  <key>CFBundlePackageType</key><string>APPL</string>
  <key>CFBundleShortVersionString</key><string>${ver}</string>
  <key>CFBundleVersion</key><string>${ver}</string>
  <key>LSMinimumSystemVersion</key><string>11.0</string>
  <key>NSHighResolutionCapable</key><true/>
</dict>
</plist>
""", false)

        write('README-unix.txt', '''\
Tiresias

Start:     ./Tiresias.sh [spec-folder]
Validate:  ./validate.sh spec-folder [--strict] [--info]

The runtime/ folder is a private Java runtime; nothing needs to be installed.
''', false)
        write('README-windows.txt', '''\
Tiresias

Start:     double-click Tiresias.bat
           For a desktop or Start menu shortcut with the app's icon: right-click Tiresias.bat >
           Show more options > Create shortcut, then shortcut Properties > Change Icon > Tiresias.ico
Validate:  validate.bat spec-folder [--strict] [--info]

The runtime folder is a private Java runtime; nothing needs to be installed.
''', true)
        write('README-mac.txt', '''\
Tiresias

Drag Tiresias.app to Applications and open it.

If macOS says the app "can't be opened", it was built by an older build.gradle that didn't mark it executable.
Fix it once with:  chmod +x Tiresias.app/Contents/MacOS/Tiresias

The app isn't signed, so macOS blocks it the first time. Either right-click it and choose Open,
or run once in Terminal:
    xattr -dr com.apple.quarantine /Applications/Tiresias.app

Validate from Terminal:
    /Applications/Tiresias.app/Contents/MacOS/Tiresias --validate spec-folder
''', false)
    }
}

// ---------------------------------------------------------------------------------------------
// Per-platform: download JDK -> extract jmods -> jlink runtime -> archive

// (the cache folder keeps its pre-rename name so already-downloaded JDKs are reused)
def jdkCache = new File(gradle.gradleUserHomeDir, "caches/can-spec-browser-jdks/${jdkFeature}")
def bundleTasks = []

platforms.each { String key, Map p ->
    def cap = capName(key)
    def isWin = p.os == 'windows'
    def isMac = p.os == 'mac'
    def archive = new File(jdkCache, "jdk-${key}.${isWin ? 'zip' : 'tar.gz'}")
    def jmodsDir = layout.buildDirectory.dir("jmods/${key}")
    def runtimeDir = layout.buildDirectory.dir("runtimes/${key}")
    def url = "https://api.adoptium.net/v3/binary/latest/${jdkFeature}/ga/${p.os}/${p.arch}/jdk/hotspot/normal/eclipse"

    def download = tasks.register("downloadJdk${cap}") {
        group = 'distribution'
        description = "Downloads the Temurin ${jdkFeature} JDK for ${key} (cached)"
        outputs.file(archive)
        onlyIf { !archive.exists() }
        doLast {
            archive.parentFile.mkdirs()
            def part = new File(archive.path + '.part')
            logger.lifecycle("Downloading ${url}")
            new URL(url).withInputStream { i -> part.withOutputStream { o -> o << i } }
            if (!part.renameTo(archive)) throw new GradleException("Could not move ${part} to ${archive}")
        }
    }

    def extract = tasks.register("extractJmods${cap}", Sync) {
        description = "Extracts the ${key} JDK's jmods"
        dependsOn download
        from(isWin ? zipTree(archive) : tarTree(resources.gzip(archive))) {
            include '**/jmods/*.jmod'
            exclude '**/._*'
            eachFile { it.path = it.name }
        }
        includeEmptyDirs = false
        into jmodsDir
    }

    def runtime = tasks.register("runtime${cap}", Exec) {
        group = 'distribution'
        description = "Links a trimmed Java runtime for ${key}"
        dependsOn extract
        def outFile = runtimeDir.get().asFile
        def jmodsFile = jmodsDir.get().asFile
        def wanted = jdkFeature
        def running = hostFeature
        inputs.dir(jmodsDir)
        inputs.property('modules', runtimeModules)
        outputs.dir(runtimeDir)
        executable jdkTool('jlink')
        args '--module-path', jmodsFile.absolutePath,
                '--add-modules', runtimeModules,
                '--output', outFile.absolutePath,
                '--strip-debug', '--no-header-files', '--no-man-pages',
                "--compress=${(jdkFeature as int) >= 21 ? 'zip-6' : '2'}".toString()
        // A base class-data archive speeds up every launch, and lets the launchers' per-user archive work.
        // jlink has to run the target's java to make it, so only runtimes for this machine get one.
        if (key == hostKey) args '--generate-cds-archive'
        doFirst {
            if (running != wanted)
                throw new GradleException("Bundles use a Java ${wanted} runtime, but Gradle is running on Java ${running}. " +
                        "jlink only links its own release: run Gradle with JDK ${wanted}, or pass -PjdkFeature=${running}.")
            if (!new File(jmodsFile, 'java.base.jmod').exists())
                throw new GradleException("No jmods in the ${key} JDK. Some JDK 24+ builds ship without them; use -PjdkFeature=21.")
            outFile.deleteDir()
        }
    }

    def bundle = tasks.register("bundle${cap}", isWin ? Zip : Tar) {
        group = 'distribution'
        description = "Builds a self-contained ${key} bundle with its own Java runtime"
        dependsOn tasks.named('jar'), runtime, launchers, 'icons'
        def icons = iconDir.get().asFile
        archiveBaseName = 'Tiresias'
        archiveVersion = appVersion
        archiveClassifier = key
        destinationDirectory = layout.buildDirectory.dir('dist')
        if (!isWin) {
            compression = Compression.GZIP
            archiveExtension = 'tar.gz'
        }
        def l = launcherDir.get().asFile
        def base = isMac ? 'Tiresias.app/Contents' : 'Tiresias'
        // Executables are marked per part: Gradle matches filesMatching patterns against each file's *source*
        // path, and archives built on Windows have no Unix permissions to copy, so nothing is left to chance.
        def exec = { permissions { unix('rwxr-xr-x') } }
        into("${base}/runtime") {
            from runtimeDir
            filesMatching(['bin/**', 'lib/jspawnhelper', 'lib/jexec'], exec)
        }
        into("${base}/app") { from tasks.named('jar') }
        if (isMac) {
            into(base) { from(new File(l, 'mac/Info.plist')) }
            into("${base}/Resources") { from(new File(icons, 'icon.icns')) { rename { 'Tiresias.icns' } } }
            into("${base}/MacOS") {
                from(new File(l, 'mac/Tiresias'))
                filePermissions { unix('rwxr-xr-x') }   // the app's main executable: without +x macOS says it "can't be opened"
            }
            from(new File(l, 'README-mac.txt')) { rename { 'README.txt' } }
        } else if (isWin) {
            into(base) {
                from(new File(l, 'windows'))
                from(new File(icons, 'icon.ico')) { rename { 'Tiresias.ico' } }
                from(new File(l, 'README-windows.txt')) { rename { 'README.txt' } }
            }
        } else {
            into(base) {
                from(new File(l, 'unix')) { filesMatching('*.sh', exec) }
                from(new File(icons, 'icon-256.png')) { rename { 'Tiresias.png' } }
                from(new File(l, 'README-unix.txt')) { rename { 'README.txt' } }
            }
        }
    }
    bundleTasks << bundle
}

tasks.register('bundleAll') {
    group = 'distribution'
    description = 'Builds a self-contained bundle for every platform in the platforms list'
    dependsOn bundleTasks
}

// ---------------------------------------------------------------------------------------------
// Native app for the current machine (real .exe / .app launcher) using jpackage

tasks.register('appImage', Exec) {
    group = 'distribution'
    description = 'Native app for this machine via jpackage. -PpackageType=dmg|pkg|msi|exe|deb|rpm builds an installer instead'
    def known = platforms.containsKey(hostKey)
    def type = (findProperty('packageType') ?: 'app-image').toString()
    def dest = layout.buildDirectory.dir('jpackage').get().asFile
    dependsOn tasks.named('jar'), 'icons'
    if (known) dependsOn "runtime${capName(hostKey)}"
    executable jdkTool('jpackage')
    args '--type', type,
            '--name', 'Tiresias',
            '--app-version', appVersion,
            '--input', layout.buildDirectory.dir('libs').get().asFile.absolutePath,
            '--main-jar', 'Tiresias.jar',
            '--main-class', 'Tiresias',
            '--runtime-image', layout.buildDirectory.dir("runtimes/${hostKey}").get().asFile.absolutePath,
            '--dest', dest.absolutePath
    args '--icon', new File(iconDir.get().asFile, hostMac ? 'icon.icns' : hostWindows ? 'icon.ico' : 'icon.png').absolutePath
    if (hostMac) args '--mac-package-identifier', 'app.tiresias'
    if (hostWindows && type != 'app-image') args '--win-menu', '--win-shortcut', '--win-dir-chooser'
    if (project.hasProperty('verbose')) args '--verbose'   // gradle appImage -Pverbose: jpackage explains each step
    def runtime = layout.buildDirectory.dir("runtimes/${hostKey}").get().asFile
    doFirst {
        if (!known) throw new GradleException("This machine is ${hostKey}; add it to the platforms list in build.gradle to package for it")
        // jpackage refuses to overwrite anything it made before (the app, or a .dmg/.msi/... installer).
        dest.deleteDir()
        // On macOS jpackage re-signs the runtime's native files and fails on read-only ones; make them writable.
        java.nio.file.Files.walk(runtime.toPath()).withCloseable { paths -> paths.forEach { it.toFile().setWritable(true, true) } }
    }
}

// ---------------------------------------------------------------------------------------------
// Formatting: Spotless runs Prettier with prettier-plugin-java (versions pinned so formatting never
// changes underneath you). Spotless doesn't read .prettierrc files, so the settings live here.

def prettierVersion = '3.3.3'
def prettierJavaVersion = '2.6.7'

spotless {
    java {
        target 'Tiresias.java', 'src/main/java/**/*.java'
        prettier(['prettier': prettierVersion, 'prettier-plugin-java': prettierJavaVersion])
                .config([
                        'parser'    : 'java',
                        'plugins'   : ['prettier-plugin-java'],   // Prettier 3 needs plugins listed as well as installed
                        'printWidth': 120,
                        'tabWidth'  : 4,
                ])
    }
    // Docs and CI config: Prettier's built-in Markdown and YAML formatting
    format 'docs', {
        target '*.md', '.github/**/*.yml'
        prettier(prettierVersion).config(['tabWidth': 2])
    }
    // Build files: just tidy whitespace (CAN spec JSON is never touched, so it keeps the jq / format.sh layout)
    format 'misc', {
        target '*.gradle', '.gitignore', 'gradle.properties'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Short names for the two Spotless tasks
tasks.register('format') {
    group = 'formatting'
    description = 'Formats everything (same as spotlessApply)'
    dependsOn 'spotlessApply'
}
tasks.register('lint') {
    group = 'verification'
    description = "Fails if anything isn't formatted (same as spotlessCheck)"
    dependsOn 'spotlessCheck'
}