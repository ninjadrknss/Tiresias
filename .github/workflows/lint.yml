name: Lint

# Checks formatting (Spotless running Prettier) on every push and pull request.
# Separate from the Release workflow so a formatting slip never blocks publishing a release.
on:
  push:
  pull_request:

jobs:
  spotless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Spotless runs Prettier through npm, so Node.js must be on the path
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - run: gradle spotlessCheck